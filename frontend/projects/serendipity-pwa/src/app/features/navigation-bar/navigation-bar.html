<mat-toolbar class="navigation-bar">

  <button matIconButton aria-label="Menu button">
    <mat-icon class="material-icons md-light" (click)="toggleSidenav.emit()">menu</mat-icon>
  </button>

  <span class="navigation-bar-title-text">Serendipity</span>

  <span class="navigation-bar-spacer"></span>

  <button matIconButton aria-label="Settings button">
    <mat-icon class="material-icons md-light">settings</mat-icon>
  </button>

  <button matIconButton aria-label="Help button">
    <mat-icon class="material-icons md-light">help</mat-icon>
  </button>

  <button matIconButton [matMenuTriggerFor]="profileMenu" aria-label="Profile button">
    <mat-icon class="material-icons md-light">person</mat-icon>
  </button>
  <mat-menu #profileMenu="matMenu">
    <button mat-menu-item (click)="logout()">
      LOGOUT
    </button>
  </mat-menu>

</mat-toolbar>
