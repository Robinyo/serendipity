name: Bug report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before opening a new one — someone may have already reported this.
  - type: input
    id: version
    attributes:
      label: Version
      description: What version are you running? (e.g. Angular 22, Spring Boot 4.0.1, Java 25)
      placeholder: "Angular 22 / Spring Boot 4.0.1 / Java 25"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Serendipity is affected?
      options:
        - Progressive Web App (Angular frontend)
        - Backend for Frontend (BFF)
        - Party Service (backend microservice)
        - Keycloak / Identity
        - Camunda / Workflow
        - Documentation
        - Docker / Deployment
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. macOS 15, Ubuntu 24.04, Windows 11
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v22.11.0"
    validations:
      required: false
  - type: input
    id: java_version
    attributes:
      label: Java version
      description: Output of `java -version`
      placeholder: "openjdk version 25"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "I expected X to happen."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this bug? Include commands, URLs, and relevant configuration.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, error messages, or anything else that helps diagnose the issue.
      placeholder: "Paste relevant log output or describe what you see."
  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct
      description: By submitting this issue I agree to follow the [code of conduct](../CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this repository's code of conduct
          required: true
