version: 2
updates:
  # Angular Frontend Configuration
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    groups:
      angular-packages:
        patterns:
          - "@angular/*"
          - "@ngtools/*"
          - "typescript"
    # Prevent major TypeScript shifts from bypassing Angular ecosystem checks
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  # Spring Boot Backend Configuration
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "daily"
