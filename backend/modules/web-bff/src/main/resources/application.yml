server:
  port: 8080
  forward-headers-strategy: framework

serendipity-web-bff:
  auth:
    enabled: false
  uri: https://serendipity.localhost

spring:
  main:
    banner-mode: off
  # profiles:
  #   active: @spring.profiles.active@
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: party-service-route
              uri: http://serendipity-party-service:8080/api/party-service
              predicates:
                - Path=/api/party-service/**
            - id: orchestration-cluster-user-tasks-service-route
              uri: http://orchestration:8080/v2/user-tasks
              predicates:
                - Path=/v2/user-tasks/**
            - id: orchestration-cluster-process-definitions-service-route
              uri: http://orchestration:8080/v2/process-definitions
              predicates:
                - Path=/v2/process-definitions/**
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: serendipity-web-bff
            client-secret: LPg1pb4vRmHLhYOrA60hiOASlMHNlnSI
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: https://serendipity-identity-service.localhost/realms/serendipity-dev

            authorization-uri: https://serendipity-identity-service.localhost/realms/serendipity-dev/protocol/openid-connect/auth

            token-uri: https://serendipity-identity-service.localhost/realms/serendipity-dev/protocol/openid-connect/token
            user-info-uri: https://serendipity-identity-service.localhost/realms/serendipity-dev/protocol/openid-connect/userinfo
            jwk-set-uri: https://serendipity-identity-service.localhost/realms/serendipity-dev/protocol/openid-connect/certs

            user-name-attribute: preferred_username

management:
  endpoints:
    web:
      exposure:
        include: beans, env, health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway.server.mvc: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
