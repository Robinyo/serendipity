services:

  # Make sure your certificates and keys (the *.pem files in the ./certs directory) have the correct permissions
  # i.e., chmod 600 *.pem && xattr -c *.pem

  nginx:
    container_name: nginx
    build:
      context: ./services/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - serendipity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${PWD}/services/nginx/conf/ssl.conf:/etc/nginx/conf/ssl.conf"
      - "${PWD}/services/nginx/conf/nginx-default.conf.template:/etc/nginx/templates/default.conf.template"
      - "${PWD}/certs:/etc/nginx/certs"
    depends_on:
      serendipity-identity-service:
        condition: service_started
      serendipity-web-bff:
        condition: service_healthy

  identity-service-data:
    container_name: identity-service-data
    image: postgres:${SERENDIPITY_STORAGE_SERVICE_VERSION}
    restart: unless-stopped
    # FIX: Point to the new non-conflicting certificate directory
    command: >
      postgres
      -c ssl=on 
      -c ssl_cert_file=/certs/server.crt 
      -c ssl_key_file=/certs/server.key
    environment:
      POSTGRES_DB: ${SERENDIPITY_IDENTITY_SERVICE_DB}
      POSTGRES_USER: ${SERENDIPITY_IDENTITY_SERVICE_USER}
      POSTGRES_PASSWORD: ${SERENDIPITY_IDENTITY_SERVICE_PASSWORD}
      PGSSLMODE: require
    env_file:
      - "${PWD}/.env"
    healthcheck:
      # test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      test: [ "CMD-SHELL", "pg_isready -U $${SERENDIPITY_IDENTITY_SERVICE_USER} -d $${SERENDIPITY_IDENTITY_SERVICE_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - serendipity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # FIX: Mount the files to an independent directory so PostgreSQL initialization bypasses them
      - "${PWD}/certs/cert.pem:/certs/server.crt:ro"
      - "${PWD}/certs/key.pem:/certs/server.key:ro"
      - identity_service_data:/var/lib/postgresql/data

  serendipity-storage-service:
    container_name: serendipity-storage-service
    image: postgres:${SERENDIPITY_STORAGE_SERVICE_VERSION}
    # image: percona/percona-distribution-postgresql:${SERENDIPITY_STORAGE_SERVICE_VERSION}
    restart: unless-stopped
    command: >
      -c ssl=on 
      -c ssl_cert_file=/var/lib/postgresql/server.crt 
      -c ssl_key_file=/var/lib/postgresql/server.key
    environment:
      POSTGRES_DB: ${SERENDIPITY_STORAGE_SERVICE_DB}
      POSTGRES_USER: ${SERENDIPITY_STORAGE_SERVICE_USER}
      POSTGRES_PASSWORD: ${SERENDIPITY_STORAGE_SERVICE_PASSWORD}
      PGSSLMODE: require
      # ENABLE_PG_TDE: 1
    env_file:
      - "${PWD}/.env"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${SERENDIPITY_STORAGE_SERVICE_USER} -d $${SERENDIPITY_STORAGE_SERVICE_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - serendipity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${PWD}/certs/cert.pem:/var/lib/postgresql/server.crt"
      - "${PWD}/certs/key.pem:/var/lib/postgresql/server.key"
      - storage_service_data:/var/lib/postgresql/data

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    ports:
      - "5443:443"
    restart: unless-stopped
    environment:
      PGADMIN_ENABLE_TLS: true
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    env_file:
      - "${PWD}/.env"
    networks:
      - serendipity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${PWD}/certs/cert.pem:/certs/server.cert:ro"
      - "${PWD}/certs/key.pem:/certs/server.key:ro"
      - "${PWD}/pgadmin_data:/var/lib/pgadmin"
    depends_on:
      identity-service-data:
        condition: service_healthy
      serendipity-storage-service:
        condition: service_healthy

  serendipity-identity-service:
    container_name: serendipity-identity-service
    image: quay.io/keycloak/keycloak:${SERENDIPITY_IDENTITY_SERVICE_VERSION}
    command:
      - "start-dev"
      - "--import-realm"
    ports:
      - "8443:8443"
      - "9000:9000"
    restart: unless-stopped
    environment:
      # Enable Health Endpoints
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: "https"
      # FIX: Force management endpoints to listen at the root, ignoring the "/auth" relative path
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: "/"

      # Proxy and Path Configuration
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_HOSTNAME: ${SERENDIPITY_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"

      # Database Connection
      KC_DB: postgres
      # KC_DB_URL: jdbc:postgresql://identity-service-data:5432/${SERENDIPITY_IDENTITY_SERVICE_DB}?sslmode=require
      KC_DB_URL: jdbc:postgresql://identity-service-data:5432/${SERENDIPITY_IDENTITY_SERVICE_DB}?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory
      KC_DB_USERNAME: ${SERENDIPITY_IDENTITY_SERVICE_USER}
      KC_DB_PASSWORD: ${SERENDIPITY_IDENTITY_SERVICE_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SERENDIPITY_IDENTITY_SERVICE_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SERENDIPITY_IDENTITY_SERVICE_ADMIN_PASSWORD}

      # Internal HTTPS / Port Settings
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key
      KC_HTTPS_PORT: "8443"
      KC_HTTP_ENABLED: "true"
    env_file:
      - "${PWD}/.env"
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request, ssl; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; urllib.request.urlopen(\"https://localhost:9000/health/ready\", context=ctx)' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - serendipity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${PWD}/certs/serendipity-identity-service-cert.pem:/opt/keycloak/conf/server.crt:ro"
      - "${PWD}/certs/serendipity-identity-service-key.pem:/opt/keycloak/conf/server.key:ro"
      - "${PWD}/services/identity-service/import:/opt/keycloak/data/import/:ro"
      - "${PWD}/services/identity-service/export:/export"
    depends_on:
      identity-service-data:
        condition: service_healthy

  serendipity-party-service:
    container_name: serendipity-party-service
    build:
      context: ./modules/party-service
      dockerfile: Dockerfile
    ports:
      - "30101:8080"
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://serendipity-storage-service:5432/${SERENDIPITY_STORAGE_SERVICE_DB}
      SPRING_DATASOURCE_USERNAME: ${SERENDIPITY_STORAGE_SERVICE_USER}
      SPRING_DATASOURCE_PASSWORD: ${SERENDIPITY_STORAGE_SERVICE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    env_file:
      - "${PWD}/.env"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - serendipity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${PWD}/certs/keystore.p12:/keystore/keystore.p12"
    depends_on:
      serendipity-storage-service:
        condition: service_healthy

  serendipity-web-bff:
    container_name: serendipity-web-bff
    build:
      context: ./modules/web-bff
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/certs/keystore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
      PARTY_SERVICE_URI: http://serendipity-party-service:8080/api/party-service
      WORKFLOW_SERVICE_URI: http://orchestration:8080/v2/user-tasks
    env_file:
      - "${PWD}/.env"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - serendipity
      # - camunda-platform
      # - identity-network
      # - web-modeler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${PWD}/certs/keystore.p12:/certs/keystore.p12:ro"
    depends_on:
      serendipity-identity-service:
        condition: service_started
      serendipity-party-service:
        condition: service_healthy

volumes:
  storage_service_data:
  identity_service_data:

networks:
  serendipity:
    name: serendipity
